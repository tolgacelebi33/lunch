name: Update lunch and SVT news

on:
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * 1-5"
    - cron: "10 5 * * 1-5"
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lunch-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update lunch
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/update_lunch.py
      - name: Update SVT news
        timeout-minutes: 1
        run: python scripts/update_news.py
      - name: Commit data
        run: |
          git config user.name "Dagens lunch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lunch.json data/news.json
          git diff --cached --quiet || git commit -m "Update lunch and SVT news"
          git push
