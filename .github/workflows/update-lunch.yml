name: Update lunch, news and market data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 22:10 UTC = 00:10 Sweden during CEST.
    # 23:10 UTC = 00:10 Sweden during CET. The script itself validates the current Swedish date/week.
    - cron: "10 22 * * 0-4"
    - cron: "10 23 * * 0-4"
    # Morning retries: 07:10 and 09:10 Swedish summer time (CEST).
    - cron: "10 5 * * 1-5"
    - cron: "10 7 * * 1-5"
    # Sunday daytime check (10:10 CEST / 09:10 CET) to catch weekly menus
    # published over the weekend, ahead of the post-midnight run.
    - cron: "10 8 * * 0"

permissions:
  contents: write
  issues: write

concurrency:
  group: lunch-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
          pip install --quiet pillow pytesseract pymupdf

      - name: Update lunch
        id: lunch
        timeout-minutes: 2
        run: python scripts/update_lunch.py

      - name: Update SVT news
        timeout-minutes: 1
        run: python scripts/update_news.py

      - name: Update commodities
        timeout-minutes: 1
        continue-on-error: true
        run: python scripts/update_commodities.py

      - name: Commit data
        run: |
          git config user.name "Dagens lunch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lunch.json data/news.json data/commodities.json data/commodities_history.json
          git diff --cached --quiet || git commit -m "Update lunch, news and market data"
          git push

      - name: Flagga om flera restauranger misslyckades
        if: steps.lunch.outputs.failed_count >= 2
        uses: actions/github-script@v7
        with:
          script: |
            const failed = "${{ steps.lunch.outputs.failed_count }}";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Lunch-pipeline: flera restauranger misslyckades";
            const body = `${failed} restauranger kunde inte uppdateras i senaste körningen (${new Date().toISOString().slice(0,10)}).\n\nSe fullständig logg: ${runUrl}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "lunch-pipeline"
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["lunch-pipeline"]
              });
            }
