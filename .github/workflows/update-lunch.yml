name: Update lunch and news
on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * 1-5"
    - cron: "10 7 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_lunch.py
      - run: python scripts/update_news.py
      - run: |
          git config user.name "Dagens lunch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lunch.json data/news.json
          git diff --cached --quiet || git commit -m "Update lunch and news"
          git push
