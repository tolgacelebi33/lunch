name: Test Glasets Hus source

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 1-5"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe Glasets Hus
        run: python scripts/probe_glassets_hus.py

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "Dagens lunch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/glasets-hus-probe.json
          git diff --cached --quiet || git commit -m "Probe Glasets Hus source"
          git push
