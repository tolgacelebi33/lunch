name: Update current lunch week

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * 1-5"
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lunch-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update current week
        run: python scripts/update_lunch.py

      - name: Commit lunch data
        run: |
          git config user.name "Dagens lunch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lunch.json
          git diff --cached --quiet || git commit -m "Update current lunch week"
          git push
